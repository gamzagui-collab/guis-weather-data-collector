name: NOAA GFS Collect and Publish 144H Operational

# P2-I-J-9 operational schedule. The activation gate still fails closed unless
# Paid approval, Canary expiry, source+v5 readiness, and the fixed activation
# timestamp are all present.
on:
  workflow_dispatch:
  schedule:
    # Two bounded attempts per day; deliberately not four until operations evidence supports expansion.
    # Staggered from the existing 48H 05:37/11:37/17:37/23:37 UTC workflow.
    - cron: "17 7,19 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  # The reusable collector owns the shared NOAA lock. Reusing that same group
  # here would make the called workflow wait behind its own caller. This
  # separate group collapses duplicate operational orchestrators while the
  # callee still serializes 48H, Canary, manual and operational NOAA access.
  group: guis-weather-gfs-144h-operational-orchestrator
  cancel-in-progress: false
  queue: max

jobs:
  activation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID_V3 }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY_V3 }}
      R2_BUCKET: guis-weather-gfs-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check awscli==1.42.58
      - id: inspect
        run: node scripts/inspect-r2-publication-144h.mjs --execute
      - name: Block overlap with Canary and unapproved Paid cutover
        env:
          WORKERS_PAID_CONFIRMED: ${{ vars.WORKERS_PAID_CONFIRMED }}
          GFS_144H_OPERATIONAL_APPROVED: ${{ vars.GFS_144H_OPERATIONAL_APPROVED }}
          GFS_144H_CANARY_EXPIRES_AT: ${{ steps.inspect.outputs.canary_expires_at }}
          GFS_144H_CANARY_ACTIVE: "false"
          GFS_144H_PUBLIC_READY: ${{ steps.inspect.outputs.public_ready }}
          GFS_144H_OPERATIONAL_ACTIVE_SINCE: ${{ vars.GFS_144H_OPERATIONAL_ACTIVE_SINCE }}
        run: node scripts/assert-operational-gate.mjs
  collect-and-publish:
    needs: activation-gate
    uses: ./.github/workflows/collect-gfs-144h-manual.yml
    secrets: inherit
