name: Monitor GFS Schedule Freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2,8,14,20 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: guis-weather-gfs-schedule-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check collector attempts and consecutive failures
        uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = await import("node:url");
            const { evaluateScheduleMonitor } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/src/schedule-monitor.mjs`).href);
            const { owner, repo } = context.repo;
            const workflow_id = "collect-gfs-automatic.yml";
            const [collector, monitor] = await Promise.all([
              github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id, per_page: 50 }),
              github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: "monitor-gfs-schedule.yml", per_page: 20 })
            ]);
            const result = evaluateScheduleMonitor({
              collectorRuns: collector.data.workflow_runs,
              monitorRuns: monitor.data.workflow_runs,
              now: new Date()
            });

            async function jobsFor(run) {
              if (!run) return [];
              const response = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: Number(run.id), per_page: 100 });
              return response.data.jobs;
            }
            function namedJob(jobs, id) {
              return jobs.find((job) => job.name === id || job.name.endsWith(` / ${id}`) || job.name.startsWith(`${id} `));
            }
            const jobsByRun = new Map();
            async function cachedJobs(run) {
              if (!run) return [];
              if (!jobsByRun.has(String(run.id))) jobsByRun.set(String(run.id), await jobsFor(run));
              return jobsByRun.get(String(run.id));
            }
            let lastPublication = null;
            let latestScheduledOutcome = "UNKNOWN";
            const publicationScan = [];
            if (result.lastScheduled) {
              const jobs = await cachedJobs(result.lastScheduled);
              const publish = namedJob(jobs, "publish");
              const collect = namedJob(jobs, "collect");
              if (collect?.conclusion === "success" && publish?.conclusion === "skipped") {
                latestScheduledOutcome = "NO_NEW_COMPLETE_RUN";
              } else if (publish?.conclusion === "success") {
                latestScheduledOutcome = "PUBLISHED_COMPLETE";
              } else if (publish?.conclusion === "failure") {
                latestScheduledOutcome = "PUBLICATION_FAILED";
              }
            }
            for (const run of collector.data.workflow_runs.filter((item) => item.status === "completed").slice(0, 20)) {
              const jobs = await cachedJobs(run);
              if (publicationScan.length < 5) publicationScan.push(`${run.id}:${jobs.map((job) => `${job.name}=${job.conclusion}`).join("|")}`);
              if (namedJob(jobs, "publish")?.conclusion === "success") {
                lastPublication = run;
                break;
              }
            }
            await core.summary.addHeading("GFS schedule monitor")
              .addRaw(`Last scheduled run: ${result.lastScheduled?.createdAt || "none"}\n`)
              .addRaw(`Last scheduled success: ${result.lastScheduledSuccess?.updatedAt || "none"}\n`)
              .addRaw(`Last manual run: ${result.lastManual?.createdAt || "none"}\n`)
              .addRaw(`Last R2 publication run: ${lastPublication?.updatedAt || "not in inspected runs"}\n`)
              .addRaw(`Latest scheduled outcome: ${latestScheduledOutcome}\n`)
              .addRaw(`Scheduled start delay minutes: ${result.lastScheduled ? (result.lastScheduled.startDelayMs / 60000).toFixed(1) : "n/a"}\n`)
              .addRaw(`Consecutive scheduled failures: ${result.consecutiveScheduledFailures}\n`)
              .addRaw(`Expected collector slot: ${result.expectedCollectorSlot}\n`)
              .addRaw(`Expected monitor slot: ${result.expectedMonitorSlot}\n`)
              .addRaw(`Publication scan: ${publicationScan.join(" ; ") || "none"}\n`)
              .addRaw(`Reasons: ${result.reasons.join(", ") || "none"}\n`).write();
            if (result.reasons.includes("COLLECTOR_SCHEDULE_START_DELAYED")) core.warning("GFS_SCHEDULE_START_DELAYED");
            if (result.reasons.includes("MONITOR_SCHEDULE_START_DELAYED")) core.warning("GFS_MONITOR_START_DELAYED");
            if (result.status === "FAILED") core.setFailed(result.reasons.join(","));
