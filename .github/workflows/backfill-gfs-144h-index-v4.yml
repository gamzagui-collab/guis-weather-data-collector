name: Backfill GFS 144H Range Index v4

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guis-weather-gfs-r2-index-v4-publisher
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID_V3 }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY_V3 }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID_V3 }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY_V3 }}
      AWS_DEFAULT_REGION: auto
      R2_BUCKET: guis-weather-gfs-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned R2 clients
        run: python -m pip install --disable-pip-version-check awscli==1.42.58 boto3==1.40.58
      - name: Download current verified 144H publication without NOAA access
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          mkdir -p source-store/horizons/144h
          aws s3api get-object --bucket "$R2_BUCKET" --key horizons/144h/latest.json \
            source-store/horizons/144h/latest.json --endpoint-url "$endpoint" >/dev/null
          run_id="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('source-store/horizons/144h/latest.json','utf8'));if(!/^\\d{8}T\\d{6}Z$/.test(x.runId||''))throw Error('RUN_ID_INVALID');process.stdout.write(x.runId)")"
          aws s3 sync "s3://${R2_BUCKET}/horizons/144h/runs/${run_id}/" \
            "source-store/horizons/144h/runs/${run_id}/" --endpoint-url "$endpoint" --only-show-errors
      - name: Verify collector and build v4 only from official published JSON
        run: |
          npm test
          node scripts/backfill-index-v4.mjs --source-store source-store --output-store index-v4-package
      - name: Publish immutable v4 objects and manifest last
        run: python python/publish_index_v4.py --execute --source-store source-store --index-store index-v4-package
