name: Audit GFS 48H 144H Cutover Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guis-weather-gfs-cutover-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID_V3 }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY_V3 }}
      R2_BUCKET: guis-weather-gfs-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check awscli==1.42.58
      - name: Verify local contracts before any R2 read
        run: npm test
      - name: Compare same-run official contracts and calculate retention dry run
        id: audit
        run: node scripts/audit-gfs-cutover-r2.mjs --execute
      - uses: actions/upload-artifact@v4
        with:
          name: gfs-cutover-audit-${{ github.run_id }}
          path: artifacts/cutover-audit.json
          if-no-files-found: error
          retention-days: 3
