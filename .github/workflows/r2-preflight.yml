name: Preview R2 Canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guis-weather-gfs-r2-preflight
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID_V3 }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY_V3 }}
      R2_BUCKET: guis-weather-gfs-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned R2 client
        run: python -m pip install --disable-pip-version-check awscli==1.42.58
      - name: Verify preflight contracts
        run: npm test
      - name: Put, read, verify, and delete private canary
        run: node scripts/r2-canary.mjs --execute
