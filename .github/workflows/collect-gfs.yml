name: NOAA GFS Collect Pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guis-weather-gfs-collector-pilot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GFS_PILOT_MODE: "true"
      GFS_FORECAST_HOURS: "1,3,6,12"
      GFS_MAX_DOWNLOAD_BYTES: "15728640"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned ecCodes
        run: python -m pip install --disable-pip-version-check eccodes==2.44.0
      - name: Verify collector contracts
        run: npm test
      - name: Collect bounded official NOAA pilot
        run: node scripts/collect-and-publish.mjs --live --local
      - name: Build verified short-lived publication artifact
        env:
          GFS_ARTIFACT_ROOT: artifact-package
        run: node scripts/create-artifact.mjs --verified-local-store .mock-r2
      - name: Upload verified collector artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: gfs-pilot-${{ github.run_id }}
          path: artifact-package
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
      - name: Record verified Artifact ID
        run: echo "Artifact ID ${{ steps.artifact.outputs.artifact-id }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Write sanitized collection summary
        if: always()
        run: node scripts/write-run-summary.mjs
