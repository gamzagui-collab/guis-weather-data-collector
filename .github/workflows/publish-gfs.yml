name: Publish Verified GFS Artifact

on:
  workflow_dispatch:
    inputs:
      collect_run_id:
        description: Successful NOAA GFS Collect Pilot workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: guis-weather-gfs-r2-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COLLECT_RUN_ID: ${{ inputs.collect_run_id }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID_V3 }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY_V3 }}
      R2_BUCKET: guis-weather-gfs-preview
    steps:
      - uses: actions/checkout@v4
      - name: Verify source workflow identity and outcome
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const runId = Number(process.env.COLLECT_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId < 1) {
              core.setFailed("COLLECT_RUN_ID_INVALID");
              return;
            }
            const { owner, repo } = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
            const validPath = String(run.path || "").split("@")[0] === ".github/workflows/collect-gfs.yml";
            if (run.repository?.full_name !== `${owner}/${repo}` || run.event !== "workflow_dispatch" ||
                run.head_branch !== "main" || run.status !== "completed" || run.conclusion !== "success" || !validPath) {
              core.setFailed("COLLECT_WORKFLOW_IDENTITY_OR_OUTCOME_INVALID");
              return;
            }
            core.setOutput("head_sha", run.head_sha);
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned R2 client
        run: python -m pip install --disable-pip-version-check awscli==1.42.58
      - name: Download artifact from the approved collector run
        uses: actions/download-artifact@v4
        with:
          name: gfs-pilot-${{ inputs.collect_run_id }}
          path: artifact-package
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.collect_run_id }}
      - name: Verify package and artifact provenance
        env:
          GFS_ARTIFACT_ROOT: artifact-package
          GFS_EXPECTED_REPOSITORY: ${{ github.repository }}
          GFS_EXPECTED_REF: main
          GFS_EXPECTED_SHA: ${{ steps.source.outputs.head_sha }}
          GFS_EXPECTED_RUN_ID: ${{ inputs.collect_run_id }}
        run: |
          npm test
          node scripts/verify-artifact.mjs
      - name: Publish verified objects to private Preview R2
        run: node scripts/publish-r2.mjs --execute --verified-local-store artifact-package/payload
